name: Publish package to Maven Central
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        description: 'Version'
        type: string
        required: true

jobs:
  publish:
    # Apple targets can only be built on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check

      - name: Publish artifact
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          
          ORG_GRADLE_PROJECT_signingPassphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingSecretKey: ${{ secrets.MAVEN_CENTRAL_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPublicKey: ${{ secrets.MAVEN_CENTRAL_GPG_PUBLIC_KEY }}
        run: |
          # separate invocations: Gradle doesn't order jreleaserDeploy after the staging publications
          ./gradlew publish
          ./gradlew jreleaserDeploy
