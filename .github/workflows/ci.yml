name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    # macOS can build every target and run the JVM, JS, Wasm and Apple tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: packages/*/build/reports/tests
