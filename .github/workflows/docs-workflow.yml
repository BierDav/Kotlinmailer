name: Build and deploy documentation website

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        type: string
        required: true
      ref:
        description: 'Git ref to build, e.g. main to publish docs fixes between releases (default: the version tag)'
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: 'Version'
        type: string
        required: true

permissions:
  id-token: write
  pages: write

env:
  WRITERSIDE_INSTANCE: 'Writerside/default'
  WRITERSIDE_ARTIFACT: 'webHelpDEFAULT2-all.zip'
  WRITERSIDE_DOCKER_VERSION: '241.18775'

  DOKKA_ARTIFACT: 'webApi-all.zip'

jobs:
  build-writerside:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.WRITERSIDE_INSTANCE }}
          artifact: ${{ env.WRITERSIDE_ARTIFACT }}
          docker-version: ${{ env.WRITERSIDE_DOCKER_VERSION }}
          location: docs

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: writerside-docs
          path: |
            artifacts/${{ env.WRITERSIDE_ARTIFACT }}
          retention-days: 1
  build-dokka:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build API documentation with Dokka
        run: ./gradlew :dokkaGenerate

      - name: Zip output to artifact
        run: |
          cd build/dokka/html
          zip -r ${{ github.workspace }}/${{ env.DOKKA_ARTIFACT }} ./*

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: dokka-docs
          path: |
            ${{ env.DOKKA_ARTIFACT }}
          retention-days: 1
  build-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Query browser cache id
        id: browser-cache-id
        run: echo "value=$(./gradlew -q :demo:kobwebBrowserCacheId)" >> $GITHUB_OUTPUT

      # Kobweb renders the static pages with a Playwright browser
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-cache-id.outputs.value }}

      - name: Export JMAP demo with Kobweb
        run: >
          ./gradlew :demo:kobwebExport
          -PkobwebExportLayout=STATIC -PkobwebReuseServer=false -PkobwebEnv=DEV
          -PkobwebRunLayout=STATIC -PkobwebBuildTarget=RELEASE

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo/.kobweb/site
          include-hidden-files: true
          retention-days: 1
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [ build-writerside, build-dokka, build-demo ]
    runs-on: ubuntu-latest
    steps:
      - name: Download writerside artifacts
        uses: actions/download-artifact@v4
        with:
          name: writerside-docs

      - name: Unzip writerside artifact
        run: unzip -O UTF-8 -qq '${{ env.WRITERSIDE_ARTIFACT }}' -d www

      - name: Download dokka artifact
        uses: actions/download-artifact@v4
        with:
          name: dokka-docs

      - name: Unzip dokka artifact
        run: unzip -O UTF-8 -qq '${{ env.DOKKA_ARTIFACT }}' -d www/api

      - name: Download demo artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: www/demo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4